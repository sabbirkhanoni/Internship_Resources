<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Registration</title>

    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-gray-100">
    <main class="min-h-screen flex items-center justify-center py-10">
      <div class="w-full max-w-4xl bg-white shadow-xl rounded-2xl p-8">
        <h1 class="text-3xl font-bold text-center text-blue-600 mb-8">
          Student Registration Form
        </h1>

        <form class="space-y-6">
          <!-- Personal Information -->
          <section>
            <h2 class="text-xl font-semibold mb-4 border-b pb-2">
              Personal Information
            </h2>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
              <div>
                <label class="block font-medium mb-2"> Full Name </label>

                <input
                  type="text"
                  placeholder="Enter your full name"
                  class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
              </div>

              <div>
                <label class="block font-medium mb-2"> Student ID </label>

                <input
                  type="text"
                  placeholder="e.g. 21-12345-1"
                  class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
              </div>

              <div>
                <label class="block font-medium mb-2"> Email </label>

                <input
                  type="email"
                  placeholder="example@email.com"
                  class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
              </div>

              <div>
                <label class="block font-medium mb-2"> Phone Number </label>

                <input
                  type="tel"
                  placeholder="01XXXXXXXXX"
                  class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
              </div>

              <div>
                <label class="block font-medium mb-2"> Date of Birth </label>

                <input
                  type="date"
                  class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
              </div>

              <div>
                <label class="block font-medium mb-2"> Gender </label>

                <div class="flex gap-5 mt-2">
                  <label class="flex items-center gap-2">
                    <input type="radio" name="gender" />
                    Male
                  </label>

                  <label class="flex items-center gap-2">
                    <input type="radio" name="gender" />
                    Female
                  </label>

                  <label class="flex items-center gap-2">
                    <input type="radio" name="gender" />
                    Other
                  </label>
                </div>
              </div>
            </div>
          </section>

          <!-- Academic Information -->

          <section>
            <h2 class="text-xl font-semibold mb-4 border-b pb-2">
              Academic Information
            </h2>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
              <div>
                <label class="block font-medium mb-2"> Department </label>

                <select
                  class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                >
                  <option>Select Department</option>
                  <option>CSE</option>
                  <option>EEE</option>
                  <option>BBA</option>
                  <option>Architecture</option>
                </select>
              </div>

              <div>
                <label class="block font-medium mb-2"> Semester </label>

                <select
                  class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                >
                  <option>Select Semester</option>

                  <option>1st</option>
                  <option>2nd</option>
                  <option>3rd</option>
                  <option>4th</option>
                  <option>5th</option>
                  <option>6th</option>
                  <option>7th</option>
                  <option>8th</option>
                </select>
              </div>

              <div>
                <label class="block font-medium mb-2"> CGPA </label>

                <input
                  type="number"
                  step="0.01"
                  placeholder="e.g. 3.75"
                  class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
              </div>

              <div>
                <label class="block font-medium mb-2"> Profile Picture </label>

                <input
                  type="file"
                  class="w-full border border-gray-300 rounded-lg px-4 py-2"
                />
              </div>
            </div>
          </section>

          <!-- Skills -->

          <section>
            <h2 class="text-xl font-semibold mb-4 border-b pb-2">Skills</h2>

            <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
              <label class="flex items-center gap-2">
                <input type="checkbox" />
                HTML
              </label>

              <label class="flex items-center gap-2">
                <input type="checkbox" />
                CSS
              </label>

              <label class="flex items-center gap-2">
                <input type="checkbox" />
                JavaScript
              </label>

              <label class="flex items-center gap-2">
                <input type="checkbox" />
                React
              </label>

              <label class="flex items-center gap-2">
                <input type="checkbox" />
                Tailwind CSS
              </label>
            </div>
          </section>

          <!-- Address -->

          <section>
            <h2 class="text-xl font-semibold mb-4 border-b pb-2">Address</h2>

            <textarea
              rows="5"
              placeholder="Enter your address"
              class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
            ></textarea>
          </section>

          <!-- Buttons -->

          <div class="flex justify-end gap-4">
            <button
              type="reset"
              class="px-6 py-2 border border-gray-400 rounded-lg hover:bg-gray-200 transition"
            >
              Reset
            </button>

            <button
              type="submit"
              class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition"
            >
              Register
            </button>
          </div>
        </form>
      </div>
    </main>
  </body>
</html>
