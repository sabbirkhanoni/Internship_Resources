<!doctype html>
<html>
  <head>
    <title>Registration Form</title>
  </head>

  <body>
    <h1>Registration</h1>

    <form>
      <label for="name">Name</label>

      <br />

      <input type="text" id="name" placeholder="Enter your name" />

      <br /><br />

      <label for="email">Email</label>

      <br />

      <input type="email" id="email" placeholder="Enter email" />

      <br /><br />

      <label>Password</label>

      <br />

      <input type="password" />

      <br /><br />

      <label>Gender</label>

      <br />

      <label>
        <input type="radio" name="gender" />
        Male
      </label>

      <label>
        <input type="radio" name="gender" />
        Female
      </label>

      <br /><br />

      <label>Skills</label>

      <br />

      <label>
        <input type="checkbox" />
        HTML
      </label>

      <label>
        <input type="checkbox" />
        CSS
      </label>

      <label>
        <input type="checkbox" />
        JavaScript
      </label>

      <br /><br />

      <label>Address</label>

      <br />

      <textarea rows="4"></textarea>

      <br /><br />

      <label>City</label>

      <br />

      <select>
        <option>Dhaka</option>

        <option>Khulna</option>

        <option>Sylhet</option>
      </select>

      <br /><br />

      <button type="submit">Register</button>
    </form>
  </body>
</html>
